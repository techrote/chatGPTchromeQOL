name: Modular QOL Suite CI
on:
  pull_request:
    paths:
      - 'chatgpt-qol-suite/**'
      - '.github/workflows/suite-ci.yml'
  push:
    branches: [main]
    paths:
      - 'chatgpt-qol-suite/**'
      - '.github/workflows/suite-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    name: Manifest and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and manifest verification
        run: |
          python chatgpt-qol-suite/tests/test_manifest.py
          find chatgpt-qol-suite -name '*.js' -print0 | xargs -0 -n1 node --check
  browser:
    name: Chromium interactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium testing tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise modular suite and dashboard
        run: python chatgpt-qol-suite/tests/test_suite.py
